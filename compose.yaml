services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch_local}
      POSTGRES_DB: dispatchflow
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatchflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dispatch:${POSTGRES_PASSWORD:-dispatch_local}@postgres:5432/dispatchflow
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "true"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
